name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pallets/click
          ref: 8.5.0
          path: .benchmark-repos/click
      - uses: actions/checkout@v4
        with:
          repository: encode/httpx
          ref: 0.28.1
          path: .benchmark-repos/httpx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python tools/bench.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check reflex_search/ tests/ tools/bench.py
      - run: pytest tests/ -v
      - run: pip install build
      - run: python -m build
      - run: pip install --no-deps --force-reinstall dist/*.whl
      - run: reflex-search --help
