[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-code-search"
version = "0.1.0"
description = "Auditable semantic code search using a REFLEX-style control loop."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "justindobbs" }]
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.16",
]

[project.scripts]
reflex-search = "reflex_search.cli:app"

[tool.setuptools]
packages = ["reflex_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
