name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pallets/click
          ref: 8.5.0
          path: .benchmark-repos/click
      - uses: actions/checkout@v4
        with:
          repository: encode/httpx
          ref: 0.28.1
          path: .benchmark-repos/httpx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bootstrap pip with the verified 26.2.2 wheel
        run: >-
          python -m pip install "pip @
          https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python tools/bench.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bootstrap pip with the verified 26.2.2 wheel
        run: >-
          python -m pip install "pip @
          https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check reflex_search/ tests/ tools/bench.py
      - run: pytest tests/ -v
      - run: pip install build
      - run: python -m build
      - run: pip install --no-deps --force-reinstall dist/*.whl
      - run: reflex-search --help
